<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចូល - គណិតវិទ្យា ថ្នាក់ទី១២</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #8b5cf6 100%);
            font-family: 'Battambang', sans-serif;
        }
        
        .login-container {
            background: white;
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            text-align: center;
            max-width: 420px;
            width: 90%;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .login-icon {
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        
        .login-title {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1e3a8a;
            margin-bottom: 0.5rem;
        }
        
        .login-subtitle {
            font-size: 1rem;
            color: #64748b;
            margin-bottom: 2rem;
        }
        
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            width: 100%;
            padding: 1rem 2rem;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Battambang', sans-serif;
        }
        
        .google-btn:hover {
            border-color: #3b82f6;
            background: #f8fafc;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        
        .google-btn:active {
            transform: translateY(0);
        }
        
        .google-icon {
            width: 24px;
            height: 24px;
        }
        
        .login-footer {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        
        .loading {
            display: none;
            margin-top: 1.5rem;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            margin-top: 0.8rem;
            color: #64748b;
            font-size: 0.9rem;
        }
        
        .error-msg {
            display: none;
            margin-top: 1rem;
            padding: 0.8rem;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            color: #dc2626;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-icon">📐</div>
        <h1 class="login-title">គណិតវិទ្យា ថ្នាក់ទី១២</h1>
        <p class="login-subtitle">ត្រៀមប្រឡងសញ្ញាបត្របាក់ឌុប ២០២៧</p>
        
        <button class="google-btn" id="googleLoginBtn" onclick="signInWithGoogle()">
            <svg class="google-icon" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            ចូលដោយ Google
        </button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p class="loading-text">កំពុងភ្ជាប់...</p>
        </div>
        
        <div class="error-msg" id="errorMsg"></div>
        
        <p class="login-footer">ចូលដោយប្រើ Account Google របស់អ្នក</p>
    </div>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    
    <script src="js/firebase-config.js"></script>
    
    <script>
        const googleLoginBtn = document.getElementById('googleLoginBtn');
        const loading = document.getElementById('loading');
        const errorMsg = document.getElementById('errorMsg');
        
        // Check if already logged in
        auth.onAuthStateChanged((user) => {
            if (user) {
                // Already logged in, redirect to main page
                window.location.href = 'index.html';
            }
        });
        
        // Google Sign-In
        function signInWithGoogle() {
            googleLoginBtn.style.display = 'none';
            loading.style.display = 'block';
            errorMsg.style.display = 'none';
            
            auth.signInWithPopup(provider)
                .then(async (result) => {
                    const user = result.user;
                    
                    // Save user info to Firestore
                    await saveUser(user);
                    
                    // Log activity
                    await logActivity('login', 'login.html');
                    
                    // Redirect to main page
                    window.location.href = 'index.html';
                })
                .catch((error) => {
                    console.error('Error:', error.message);
                    googleLoginBtn.style.display = 'flex';
                    loading.style.display = 'none';
                    errorMsg.textContent = 'មានកំហុសក្នុងការចូល។ សូមព្យាយាមម្តងទៀត។';
                    errorMsg.style.display = 'block';
                });
        }
    </script>
</body>
</html>
