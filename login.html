<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចូល - គណិតវិទ្យា ថ្នាក់ទី១២</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 50%, #8b5cf6 100%);
            font-family: 'Battambang', sans-serif;
        }
        
        .login-container {
            background: white;
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            text-align: center;
            max-width: 420px;
            width: 90%;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .login-icon {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
        }
        
        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1e3a8a;
            margin-bottom: 0.3rem;
        }
        
        .login-subtitle {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 1.5rem;
        }
        
        /* Tab Navigation */
        .tab-nav {
            display: flex;
            background: #f1f5f9;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 1.5rem;
        }
        
        .tab-btn {
            flex: 1;
            padding: 0.7rem;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-family: 'Battambang', sans-serif;
            font-size: 0.95rem;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .tab-btn.active {
            background: #3b82f6;
            color: white;
        }
        
        /* Form Styles */
        .form-group {
            margin-bottom: 1rem;
            text-align: left;
        }
        
        .form-label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 0.4rem;
        }
        
        .form-input {
            width: 100%;
            padding: 0.8rem 1rem;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            font-family: 'Battambang', sans-serif;
            transition: all 0.2s;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
        
        .form-input::placeholder {
            color: #94a3b8;
        }
        
        .submit-btn {
            width: 100%;
            padding: 0.9rem;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Battambang', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .submit-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }
        
        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
        }
        
        .divider-line {
            flex: 1;
            height: 1px;
            background: #e2e8f0;
        }
        
        .divider-text {
            padding: 0 1rem;
            color: #94a3b8;
            font-size: 0.85rem;
        }
        
        /* Google Button */
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            width: 100%;
            padding: 0.9rem 2rem;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            color: #1e293b;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'Battambang', sans-serif;
        }
        
        .google-btn:hover {
            border-color: #3b82f6;
            background: #f8fafc;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }
        
        .google-icon {
            width: 22px;
            height: 22px;
        }
        
        /* Links */
        .form-link {
            color: #3b82f6;
            text-decoration: none;
            font-size: 0.85rem;
            cursor: pointer;
        }
        
        .form-link:hover {
            text-decoration: underline;
        }
        
        .switch-text {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #64748b;
        }
        
        /* Error Message */
        .error-msg {
            display: none;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        
        /* Success Message */
        .success-msg {
            display: none;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #16a34a;
            padding: 0.8rem;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }
        
        /* Loading */
        .loading {
            display: none;
            margin-top: 1rem;
        }
        
        .spinner {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #3b82f6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Footer */
        .login-footer {
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: #94a3b8;
        }
        
        /* Hidden */
        .hidden {
            display: none !important;
        }
        
        /* Tab Content */
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-icon">📚</div>
        <h1 class="login-title">គណិតវិទ្យា ថ្នាក់ទី១២</h1>
        <p class="login-subtitle">ត្រៀមប្រឡងសញ្ញាបត្របាក់ឌុប ២០២៧</p>
        
        <!-- Tab Navigation -->
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('login')">ចូល</button>
            <button class="tab-btn" onclick="switchTab('signup')">ចុះឈ្មោះ</button>
        </div>
        
        <!-- Login Form -->
        <div id="tab-login" class="tab-content active">
            <div id="loginError" class="error-msg"></div>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="loginEmail" placeholder="example@gmail.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">ពាក្យសម្ងាត់</label>
                    <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="submit-btn" id="loginBtn">ចូល</button>
            </form>
            
            <div class="divider">
                <div class="divider-line"></div>
                <span class="divider-text">ឬ</span>
                <div class="divider-line"></div>
            </div>
            
            <button class="google-btn" onclick="signInWithGoogle()">
                <img class="google-icon" src="https://www.gstatic.com/firebasejs/ui/auth/images/google.svg" alt="Google">
                ចូលជាមួយ Google
            </button>
        </div>
        
        <!-- Signup Form -->
        <div id="tab-signup" class="tab-content">
            <div id="signupError" class="error-msg"></div>
            <div id="signupSuccess" class="success-msg"></div>
            
            <form id="signupForm" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label class="form-label">ឈ្មោះ</label>
                    <input type="text" class="form-input" id="signupName" placeholder="ឈ្មោះរបស់អ្នក" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <input type="email" class="form-input" id="signupEmail" placeholder="example@gmail.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label">ពាក្យសម្ងាត់</label>
                    <input type="password" class="form-input" id="signupPassword" placeholder="យ៉ាហោចណាស់ ៦ តួ" required minlength="6">
                </div>
                <div class="form-group">
                    <label class="form-label">បញ្ជាក់ពាក្យសម្ងាត់</label>
                    <input type="password" class="form-input" id="signupConfirm" placeholder="បញ្ជាក់ពាក្យសម្ងាត់" required>
                </div>
                <button type="submit" class="submit-btn" id="signupBtn">ចុះឈ្មោះ</button>
            </form>
            
            <div class="switch-text">
               មានគណនីរួចហើយ? <span class="form-link" onclick="switchTab('login')">ចូល</span>
            </div>
        </div>
        
        <p class="login-footer">
            ដោយការចូល អ្នកយល់ព្រមជាមួយ<br>
            <span class="form-link">លក្ខខណ្ឌប្រើប្រាស់</span> និង <span class="form-link">គោលនយោបាយភាពឯកជន</span>
        </p>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>
    </div>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    
    <script src="js/firebase-config.js"></script>
    
    <script>
        // Tab switching
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
                document.getElementById('tab-login').classList.add('active');
            } else {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                document.getElementById('tab-signup').classList.add('active');
            }
            
            // Clear messages
            clearMessages();
        }
        
        // Clear messages
        function clearMessages() {
            document.querySelectorAll('.error-msg, .success-msg').forEach(el => {
                el.style.display = 'none';
                el.textContent = '';
            });
        }
        
        // Show error
        function showError(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.style.display = 'block';
        }
        
        // Show success
        function showSuccess(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.style.display = 'block';
        }
        
        // Check if user is allowed
        async function isUserAllowed(email) {
            if (isAdmin(auth.currentUser)) return true;
            const blockedDoc = await db.collection('blockedEmails').doc(email).get();
            if (blockedDoc.exists) return false;
            const allowedSnapshot = await db.collection('allowedEmails').get();
            if (allowedSnapshot.empty) return true;
            const allowedDoc = await db.collection('allowedEmails').doc(email).get();
            return allowedDoc.exists;
        }
        
        // Check if already logged in
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const allowed = await isUserAllowed(user.email);
                if (allowed) {
                    window.location.href = 'index.html';
                } else {
                    await auth.signOut();
                }
            }
        });
        
        // Handle Login
        async function handleLogin(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            document.getElementById('loginBtn').disabled = true;
            document.getElementById('loading').style.display = 'block';
            clearMessages();
            
            try {
                const result = await auth.signInWithEmailAndPassword(email, password);
                const user = result.user;
                
                // Check if allowed
                const allowed = await isUserAllowed(user.email);
                if (!allowed) {
                    await auth.signOut();
                    showError('loginError', 'អ្នកមិនមានសិទ្ធិចូលប្រើប្រាស់ទំព័រនេះទេ។');
                    document.getElementById('loginBtn').disabled = false;
                    document.getElementById('loading').style.display = 'none';
                    return;
                }
                
                // Save user and log activity
                await saveUser(user);
                await logActivity('login', 'login.html');
                
                window.location.href = 'index.html';
            } catch (error) {
                console.error('Login error:', error);
                let errorMsg = 'មានកំហុសក្នុងការចូល។';
                
                if (error.code === 'auth/user-not-found') {
                    errorMsg = 'រកមិនឃើញគណនីនេះទេ។';
                } else if (error.code === 'auth/wrong-password') {
                    errorMsg = 'ពាក្យសម្ងាត់មិនត្រឹមត្រូវទេ។';
                } else if (error.code === 'auth/invalid-email') {
                    errorMsg = 'Email មិនត្រឹមត្រូវទេ។';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMsg = 'ព្យាយាមច្រើនពេក។ សូមរង់ចាំបន្តិច។';
                }
                
                showError('loginError', errorMsg);
                document.getElementById('loginBtn').disabled = false;
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        // Handle Signup
        async function handleSignup(e) {
            e.preventDefault();
            
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirm').value;
            
            // Validate
            if (password !== confirm) {
                showError('signupError', 'ពាក្យសម្ងាត់មិនត្រូវគ្នាទេ។');
                return;
            }
            
            document.getElementById('signupBtn').disabled = true;
            document.getElementById('loading').style.display = 'block';
            clearMessages();
            
            try {
                // Create user
                const result = await auth.createUserWithEmailAndPassword(email, password);
                const user = result.user;
                
                // Update display name
                await user.updateProfile({ displayName: name });
                
                // Save user to Firestore
                await db.collection('users').doc(user.uid).set({
                    name: name,
                    email: email,
                    photo: '',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                // Log activity
                await db.collection('activity').add({
                    action: 'signup',
                    userId: user.uid,
                    userName: name,
                    userEmail: email,
                    page: 'login.html',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                showSuccess('signupSuccess', 'បានចុះឈ្មោះដោយជោគជ័យ! កំពុងផ្ទុក...');
                
                // Redirect after 1.5s
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
                
            } catch (error) {
                console.error('Signup error:', error);
                let errorMsg = 'មានកំហុសក្នុងការចុះឈ្មោះ។';
                
                if (error.code === 'auth/email-already-in-use') {
                    errorMsg = 'Email នេះត្រូវបានប្រើប្រាស់រួចហើយ។';
                } else if (error.code === 'auth/weak-password') {
                    errorMsg = 'ពាក្យសម្ងាត់ខ្សោយពេក។ សូមប្រើយ៉ាហោចណាស់ ៦ តួ។';
                } else if (error.code === 'auth/invalid-email') {
                    errorMsg = 'Email មិនត្រឹមត្រូវទេ។';
                }
                
                showError('signupError', errorMsg);
                document.getElementById('signupBtn').disabled = false;
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        // Google Sign-In
        async function signInWithGoogle() {
            document.getElementById('loading').style.display = 'block';
            clearMessages();
            
            try {
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                
                // Check if allowed
                const allowed = await isUserAllowed(user.email);
                if (!allowed) {
                    await auth.signOut();
                    showError('loginError', 'អ្នកមិនមានសិទ្ធិចូលប្រើប្រាស់ទំព័រនេះទេ។');
                    document.getElementById('loading').style.display = 'none';
                    return;
                }
                
                // Save user and log activity
                await saveUser(user);
                await logActivity('login', 'login.html');
                
                window.location.href = 'index.html';
            } catch (error) {
                console.error('Google login error:', error);
                showError('loginError', 'មានកំហុសក្នុងការចូល។ សូមព្យាយាមម្តងទៀត។');
                document.getElementById('loading').style.display = 'none';
            }
        }
    </script>
</body>
</html>
