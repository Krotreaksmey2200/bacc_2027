<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ចូល - គណិតវិទ្យា ថ្នាក់ទី១២</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            min-height: 100vh;
            display: flex;
            font-family: 'Inter', 'Battambang', sans-serif;
            background: #f8fafc;
        }
        
        /* Left Panel */
        .left-panel {
            flex: 1;
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem;
            position: relative;
            overflow: hidden;
        }
        
        .left-panel::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: pulse 8s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }
        
        .brand {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
        }
        
        .brand-logo {
            width: 80px;
            height: 80px;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        .brand-logo svg {
            width: 48px;
            height: 48px;
        }
        
        .brand h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            font-family: 'Battambang', sans-serif;
        }
        
        .brand p {
            font-size: 1rem;
            opacity: 0.9;
            font-family: 'Battambang', sans-serif;
        }
        
        .features {
            margin-top: 3rem;
            text-align: left;
        }
        
        .feature-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            color: white;
            font-family: 'Battambang', sans-serif;
        }
        
        .feature-icon {
            width: 40px;
            height: 40px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .feature-icon svg {
            width: 20px;
            height: 20px;
            fill: white;
        }
        
        /* Right Panel */
        .right-panel {
            width: 480px;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 3rem;
            box-shadow: -10px 0 40px rgba(0,0,0,0.05);
        }
        
        .login-header {
            margin-bottom: 2rem;
        }
        
        .login-header h2 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 0.5rem;
        }
        
        .login-header p {
            color: #64748b;
            font-size: 0.95rem;
        }
        
        /* Tab Navigation */
        .tab-nav {
            display: flex;
            background: #f1f5f9;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 1.5rem;
        }
        
        .tab-btn {
            flex: 1;
            padding: 0.75rem;
            border: none;
            background: transparent;
            border-radius: 8px;
            font-family: 'Battambang', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            color: #64748b;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .tab-btn.active {
            background: white;
            color: #1e293b;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        
        /* Form Styles */
        .form-group {
            margin-bottom: 1.25rem;
        }
        
        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 0.5rem;
        }
        
        .input-wrapper {
            position: relative;
        }
        
        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            width: 20px;
            height: 20px;
            color: #9ca3af;
        }
        
        .form-input {
            width: 100%;
            padding: 0.875rem 1rem 0.875rem 2.75rem;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            background: #fafafa;
        }
        
        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            background: white;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        }
        
        .form-input::placeholder {
            color: #9ca3af;
        }
        
        .submit-btn {
            width: 100%;
            padding: 1rem;
            background: #2563eb;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Battambang', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
        }
        
        .submit-btn:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .submit-btn:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
        }
        
        .divider-line {
            flex: 1;
            height: 1px;
            background: #e5e7eb;
        }
        
        .divider-text {
            padding: 0 1rem;
            color: #9ca3af;
            font-size: 0.875rem;
        }
        
        /* Google Button */
        .google-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            padding: 0.875rem;
            background: white;
            border: 1.5px solid #e5e7eb;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            color: #374151;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        
        .google-btn:hover {
            border-color: #d1d5db;
            background: #f9fafb;
        }
        
        .google-icon {
            width: 20px;
            height: 20px;
        }
        
        /* Links */
        .form-link {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
            cursor: pointer;
        }
        
        .form-link:hover {
            text-decoration: underline;
        }
        
        .switch-text {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #64748b;
            text-align: center;
        }
        
        /* Messages */
        .message {
            display: none;
            padding: 0.875rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
        }
        
        .error-msg {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
        }
        
        .success-msg {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            color: #16a34a;
        }
        
        /* Loading */
        .loading {
            display: none;
            text-align: center;
            margin-top: 1rem;
        }
        
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #e5e7eb;
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Footer */
        .login-footer {
            margin-top: 2rem;
            font-size: 0.8rem;
            color: #9ca3af;
            text-align: center;
        }
        
        /* Tab Content */
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        /* Responsive */
        @media (max-width: 900px) {
            .left-panel {
                display: none;
            }
            .right-panel {
                width: 100%;
                min-height: 100vh;
            }
        }
    </style>
</head>
<body>
    <!-- Left Panel -->
    <div class="left-panel">
        <div class="brand">
            <div class="brand-logo">
                <svg viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2">
                    <path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/>
                </svg>
            </div>
            <h1>គណិតវិទ្យា ថ្នាក់ទី១២</h1>
            <p>ត្រៀមប្រឡងសញ្ញាបត្របាក់ឌុប ២០២៧</p>
        </div>
        
        <div class="features">
            <div class="feature-item">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                </div>
                <span>១៨ មេរៀនពេញលេញ</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </div>
                <span>លំហាត់អន្តរកម្ម</span>
            </div>
            <div class="feature-item">
                <div class="feature-icon">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                </div>
                <span>ឯកសារស្រាវជ្រាវ</span>
            </div>
        </div>
    </div>
    
    <!-- Right Panel -->
    <div class="right-panel">
        <div class="login-header">
            <h2>ស្វាគមន៍</h2>
            <p>ចូលដើម្បីបន្តការសិក្សា</p>
        </div>
        
        <!-- Tab Navigation -->
        <div class="tab-nav">
            <button class="tab-btn active" onclick="switchTab('login')">ចូល</button>
            <button class="tab-btn" onclick="switchTab('signup')">ចុះឈ្មោះ</button>
        </div>
        
        <!-- Login Form -->
        <div id="tab-login" class="tab-content active">
            <div id="loginError" class="message error-msg"></div>
            
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
                        </svg>
                        <input type="email" class="form-input" id="loginEmail" placeholder="example@gmail.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">ពាក្យសម្ងាត់</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                        <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="submit-btn" id="loginBtn">ចូល</button>
            </form>
            
            <div class="divider">
                <div class="divider-line"></div>
                <span class="divider-text">ឬ</span>
                <div class="divider-line"></div>
            </div>
            
            <button class="google-btn" onclick="signInWithGoogle()">
                <img class="google-icon" src="https://www.gstatic.com/firebasejs/ui/auth/images/google.svg" alt="Google">
                <span>ចូលជាមួយ Google</span>
            </button>
        </div>
        
        <!-- Signup Form -->
        <div id="tab-signup" class="tab-content">
            <div id="signupError" class="message error-msg"></div>
            <div id="signupSuccess" class="message success-msg"></div>
            
            <form id="signupForm" onsubmit="handleSignup(event)">
                <div class="form-group">
                    <label class="form-label">ឈ្មោះ</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        <input type="text" class="form-input" id="signupName" placeholder="ឈ្មោះរបស់អ្នក" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Email</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"/>
                        </svg>
                        <input type="email" class="form-input" id="signupEmail" placeholder="example@gmail.com" required>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">ពាក្យសម្ងាត់</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                        </svg>
                        <input type="password" class="form-input" id="signupPassword" placeholder="យ៉ាហោចណាស់ ៦ តួ" required minlength="6">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">បញ្ជាក់ពាក្យសម្ងាត់</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/>
                        </svg>
                        <input type="password" class="form-input" id="signupConfirm" placeholder="បញ្ជាក់ពាក្យសម្ងាត់" required>
                    </div>
                </div>
                <button type="submit" class="submit-btn" id="signupBtn">ចុះឈ្មោះ</button>
            </form>
            
            <div class="switch-text">
                មានគណនីរួចហើយ? <span class="form-link" onclick="switchTab('login')">ចូល</span>
            </div>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
        </div>
        
        <p class="login-footer">
            ដោយការចូល អ្នកយល់ព្រមជាមួយ
            <a href="#" class="form-link">លក្ខខណ្ឌប្រើប្រាស់</a> និង
            <a href="#" class="form-link">គោលនយោបាយភាពឯកជន</a>
        </p>
    </div>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    
    <script src="js/firebase-config.js"></script>
    
    <script>
        // Tab switching
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if (tab === 'login') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
                document.getElementById('tab-login').classList.add('active');
            } else {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                document.getElementById('tab-signup').classList.add('active');
            }
            
            clearMessages();
        }
        
        // Clear messages
        function clearMessages() {
            document.querySelectorAll('.message').forEach(el => {
                el.style.display = 'none';
                el.textContent = '';
            });
        }
        
        // Show error
        function showError(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.style.display = 'block';
        }
        
        // Show success
        function showSuccess(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.style.display = 'block';
        }
        
        // Check if user is allowed
        async function isUserAllowed(email) {
            if (isAdmin(auth.currentUser)) return true;
            const blockedDoc = await db.collection('blockedEmails').doc(email).get();
            if (blockedDoc.exists) return false;
            const allowedSnapshot = await db.collection('allowedEmails').get();
            if (allowedSnapshot.empty) return true;
            const allowedDoc = await db.collection('allowedEmails').doc(email).get();
            return allowedDoc.exists;
        }
        
        // Check if already logged in
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                const allowed = await isUserAllowed(user.email);
                if (allowed) {
                    window.location.href = 'index.html';
                } else {
                    await auth.signOut();
                }
            }
        });
        
        // Handle Login
        async function handleLogin(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            document.getElementById('loginBtn').disabled = true;
            document.getElementById('loading').style.display = 'block';
            clearMessages();
            
            try {
                const result = await auth.signInWithEmailAndPassword(email, password);
                const user = result.user;
                
                const allowed = await isUserAllowed(user.email);
                if (!allowed) {
                    await auth.signOut();
                    showError('loginError', 'អ្នកមិនមានសិទ្ធិចូលប្រើប្រាស់ទំព័រនេះទេ។');
                    document.getElementById('loginBtn').disabled = false;
                    document.getElementById('loading').style.display = 'none';
                    return;
                }
                
                await saveUser(user);
                await logActivity('login', 'login.html');
                
                window.location.href = 'index.html';
            } catch (error) {
                console.error('Login error:', error);
                let errorMsg = 'មានកំហុសក្នុងការចូល។';
                
                if (error.code === 'auth/user-not-found') {
                    errorMsg = 'រកមិនឃើញគណនីនេះទេ។';
                } else if (error.code === 'auth/wrong-password') {
                    errorMsg = 'ពាក្យសម្ងាត់មិនត្រឹមត្រូវទេ។';
                } else if (error.code === 'auth/invalid-email') {
                    errorMsg = 'Email មិនត្រឹមត្រូវទេ។';
                } else if (error.code === 'auth/too-many-requests') {
                    errorMsg = 'ព្យាយាមច្រើនពេក។ សូមរង់ចាំបន្តិច។';
                }
                
                showError('loginError', errorMsg);
                document.getElementById('loginBtn').disabled = false;
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        // Handle Signup
        async function handleSignup(e) {
            e.preventDefault();
            
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirm').value;
            
            if (password !== confirm) {
                showError('signupError', 'ពាក្យសម្ងាត់មិនត្រូវគ្នាទេ។');
                return;
            }
            
            document.getElementById('signupBtn').disabled = true;
            document.getElementById('loading').style.display = 'block';
            clearMessages();
            
            try {
                const result = await auth.createUserWithEmailAndPassword(email, password);
                const user = result.user;
                
                await user.updateProfile({ displayName: name });
                
                await db.collection('users').doc(user.uid).set({
                    name: name,
                    email: email,
                    photo: '',
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                await db.collection('activity').add({
                    action: 'signup',
                    userId: user.uid,
                    userName: name,
                    userEmail: email,
                    page: 'login.html',
                    timestamp: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                await db.collection('allowedEmails').doc(email).set({
                    email: email,
                    addedBy: 'self-signup'
                });
                
                showSuccess('signupSuccess', 'បានចុះឈ្មោះដោយជោគជ័យ!');
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1500);
                
            } catch (error) {
                console.error('Signup error:', error);
                let errorMsg = 'មានកំហុសក្នុងការចុះឈ្មោះ។';
                
                if (error.code === 'auth/email-already-in-use') {
                    errorMsg = 'Email នេះត្រូវបានប្រើប្រាស់រួចហើយ។';
                } else if (error.code === 'auth/weak-password') {
                    errorMsg = 'ពាក្យសម្ងាត់ខ្សោយពេក។ សូមប្រើយ៉ាហោចណាស់ ៦ តួ។';
                } else if (error.code === 'auth/invalid-email') {
                    errorMsg = 'Email មិនត្រឹមត្រូវទេ។';
                }
                
                showError('signupError', errorMsg);
                document.getElementById('signupBtn').disabled = false;
                document.getElementById('loading').style.display = 'none';
            }
        }
        
        // Google Sign-In
        async function signInWithGoogle() {
            document.getElementById('loading').style.display = 'block';
            clearMessages();
            
            try {
                const result = await auth.signInWithPopup(provider);
                const user = result.user;
                
                // First-time Google user → add to allowedEmails
                const allowedDoc = await db.collection('allowedEmails').doc(user.email).get();
                if (!allowedDoc.exists) {
                    await db.collection('allowedEmails').doc(user.email).set({
                        email: user.email,
                        addedBy: 'google-signup'
                    });
                }
                
                await saveUser(user);
                await logActivity('login', 'login.html');
                
                window.location.href = 'index.html';
            } catch (error) {
                console.error('Google login error:', error);
                showError('loginError', 'មានកំហុសក្នុងការចូល។ សូមព្យាយាមម្តងទៀត។');
                document.getElementById('loading').style.display = 'none';
            }
        }
    </script>
</body>
